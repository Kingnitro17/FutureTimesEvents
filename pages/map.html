<!DOCTYPE html>
<html lang="en" class="page-light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Explore events on the map – VYBE" />
  <title>Map View – VYBE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/styles.css" />
  <style>
    /* Polished Map Page - Enhanced for #FFFFF0 light theme */
    .map-wrapper { 
      min-height: 100vh; display: flex; flex-direction: column; 
      background: var(--bg-light);
    }
    
    .map-main-content {
      flex: 1; display: flex; height: calc(100vh - var(--nav-height));
      overflow: hidden;
    }
    
    .map-sidebar {
      width: 440px; flex-shrink: 0; 
      padding: 48px 32px; border-right: 1px solid var(--border-light);
      background: var(--bg-glass-light); backdrop-filter: var(--glass-blur);
      overflow-y: auto;
    }
    
    .map-sidebar h2 { 
      font-family: var(--font-display); font-size: 1.6rem; 
      font-weight: 800; margin-bottom: 32px; color: var(--text-light);
    }
    
    .map-search {
      padding: 16px 24px; border-radius: 50px; gap: 12px;
      background: var(--bg-card-light); border: 2px solid var(--border-light);
      margin-bottom: 32px; font-size: 1.05rem;
    }
    
    .map-search input {
      color: var(--text-light); font-size: 1.05rem; font-weight: 500;
    }
    
    .map-event-list { gap: 20px; }
    .map-event-item {
      padding: 24px; gap: 20px; border-radius: var(--radius);
      background: var(--bg-glass-light); border: 2px solid var(--border-light);
      transition: all var(--transition);
    }
    
    .map-event-item:hover, .map-event-item.active {
      border-color: #3b82f6; 
      background: rgba(59,130,246,0.08);
      transform: translateX(8px);
    }
    
    .map-event-item img {
      width: 80px; height: 80px; border-radius: var(--radius-sm);
    }
    
    .map-event-info h4 { 
      font-size: 1.15rem; font-weight: 800; margin-bottom: 8px;
      color: var(--text-light);
    }
    
    .map-event-info p { 
      font-size: 0.98rem; color: var(--text-secondary-light);
      margin-bottom: 4px;
    }
    
    .map-event-info .distance { 
      color: #3b82f6 !important; font-weight: 700; font-size: 1rem;
    }
    
    .map-container {
      flex: 1; position: relative; 
      background: linear-gradient(135deg, var(--bg-card-light), var(--bg-light));
    }
    
    /* Blue-themed pins */
    .mock-map {
      position: absolute; inset: 0;
      background:
        radial-gradient(circle at 30% 40%, rgba(59,130,246,0.15) 0%, transparent 40%),
        radial-gradient(circle at 70% 60%, rgba(59,130,246,0.1) 0%, transparent 35%),
        radial-gradient(circle at 50% 50%, rgba(96,165,250,0.08) 0%, transparent 60%);
    }
    
    .map-pin {
      background: var(--blue-gradient) !important;
      box-shadow: 0 6px 20px var(--blue-glow) !important;
    }
    
    .map-pin-pulse {
      border-color: #3b82f6;
    }
    
    .nearby-badge {
      bottom: 40px; padding: 16px 32px; font-size: 1.1rem;
      background: var(--bg-glass-light); border: 2px solid var(--border-light);
      box-shadow: var(--shadow-light);
    }
    
    @media (max-width: 768px) {
      .map-sidebar { 
        width: 100%; padding: 32px 24px; 
        border-right: none; border-bottom: 1px solid var(--border-light);
        max-height: 45vh;
      }
      .map-main-content { height: calc(100vh - var(--nav-height) - 1px); }
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <a href="../index.html" class="nav-logo">
        <span class="logo-icon">◈</span>
        <span class="logo-text">VYBE</span>
      </a>

      <!-- Mimicking Ticketbay Layout -->
      <div class="nav-actions">
        <!-- Search Pill -->
        <button class="nav-search-pill" id="navSearchTrigger">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
          <span>Search</span>
        </button>

        <!-- Heart Icon -->
        <button class="btn-icon" aria-label="Saved Events">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
          </svg>
        </button>

        <!-- Dropdown Menu -->
        <div class="nav-dropdown-wrapper">
          <button class="btn-icon" id="hamburger" aria-label="User Menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </button>
          
          <div class="nav-dropdown" id="mobileMenu">
            <a href="../index.html" class="dropdown-item">Home</a>
            <a href="map.html" class="dropdown-item">Map View</a>
            <button id="themeToggle" class="dropdown-item">Toggle Theme</button>
            <div class="dropdown-divider"></div>
            <button id="signInBtn" class="dropdown-item">Sign In</button>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <div class="map-wrapper">
    <div class="map-main-content">
      <!-- Enhanced Sidebar -->
      <div class="map-sidebar">
        <h2>📍 Events Near You</h2>
        <div class="map-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" placeholder="Search locations or venues..." id="mapSearchInput" />
        </div>
        <div class="map-event-list" id="mapEventList"></div>
      </div>

      <!-- Enhanced Map Area -->
      <div class="map-container">
        <div class="mock-map">
          <!-- Blue-themed event pins -->
          <div class="map-pin" style="top:25%;left:35%"><span>🎵</span><div class="map-pin-pulse"></div>
            <div class="pin-tooltip"><div class="pin-tooltip-inner">
              <strong>Neon Dreams Festival</strong><span>Brooklyn Mirage · $45</span>
            </div></div>
          </div>
          <div class="map-pin" style="top:40%;left:55%"><span>💻</span>
            <div class="pin-tooltip"><div class="pin-tooltip-inner">
              <strong>AI & Future Summit</strong><span>Javits Center · $120</span>
            </div></div>
          </div>
          <div class="map-pin" style="top:60%;left:30%"><span>🍽️</span>
            <div class="pin-tooltip"><div class="pin-tooltip-inner">
              <strong>Harvest & Vine</strong><span>Hudson Valley · $35</span>
            </div></div>
          </div>
          <div class="map-pin" style="top:35%;left:70%"><span>🎨</span>
            <div class="pin-tooltip"><div class="pin-tooltip-inner">
              <strong>Contemporary Art Walk</strong><span>Chelsea · Free</span>
            </div></div>
          </div>
          <div class="map-pin" style="top:55%;left:50%"><span>🎷</span><div class="map-pin-pulse"></div>
            <div class="pin-tooltip"><div class="pin-tooltip-inner">
              <strong>Jazz Under The Stars</strong><span>Lincoln Center · $55</span>
            </div></div>
          </div>
        </div>

        <div class="nearby-badge">
          <span class="badge-dot" style="animation:pulse 2s infinite; background:#3b82f6;"></span>
          5 events within 25 km
          <button class="btn-dynamo" style="margin-left:auto; padding:8px 20px; font-size:0.9rem;">View All</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="../js/animations.js"></script>
  <script src="../js/components.js"></script>
  <script>
    // Theme
    const saved = localStorage.getItem('vybe-theme') || 'dark';
    document.documentElement.setAttribute('data-theme', saved);
    document.getElementById('themeToggle').addEventListener('click', () => {
      const c = document.documentElement.getAttribute('data-theme');
      const n = c === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', n);
      localStorage.setItem('vybe-theme', n);
    });

    // Map sidebar events
    const events = [
      { title:'Neon Dreams Festival', venue:'Brooklyn Mirage, NY', date:'May 10 · 8PM', distance:'2.4 km', img:'../assets/images/event4.png' },
      { title:'AI & Future Summit', venue:'Javits Center, NY', date:'May 12 · 9AM', distance:'5.1 km', img:'../assets/images/event2.png' },
      { title:'Harvest & Vine', venue:'Hudson Valley, NY', date:'May 18 · 12PM', distance:'12 km', img:'../assets/images/event3.png' },
      { title:'Contemporary Art Walk', venue:'Chelsea, NY', date:'May 24 · 2PM', distance:'3.8 km', img:'../assets/images/event1.png' },
      { title:'Jazz Under The Stars', venue:'Lincoln Center, NY', date:'Jun 20 · 7PM', distance:'4.2 km', img:'../assets/images/event1.png' },
    ];
    const list = document.getElementById('mapEventList');
    events.forEach(ev => {
      list.innerHTML += `
        <div class="map-event-item" onclick="window.location.href='event.html'">
          <img src="${ev.img}" alt="${ev.title}" />
          <div class="map-event-info">
            <h4>${ev.title}</h4>
            <p>${ev.date}</p>
            <p>${ev.venue}</p>
            <div class="distance">📍 ${ev.distance} away</div>
          </div>
        </div>
      `;
    });

    // Search filter
    document.getElementById('mapSearchInput').addEventListener('input', function() {
      const q = this.value.toLowerCase();
      document.querySelectorAll('.map-event-item').forEach(item => {
        const text = item.textContent.toLowerCase();
        item.style.display = text.includes(q) ? 'flex' : 'none';
      });
    });
  </script>
</body>
</html>
